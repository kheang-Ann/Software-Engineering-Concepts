services:
  rabbitmq:
    image: rabbitmq:4.2-management
    networks:
      - rabbit-net
    volumes:
      - rabbit-data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest

  producer:
    build: ./producer
    restart: on-failure
    depends_on:
      - rabbitmq
    networks:
      - rabbit-net
    environment:
      - RABBITMQ_HOST=rabbitmq

  consumer:
    build: ./consumer
    command: sh -c "java -cp app.jar Recv & tail -f /dev/null"
    depends_on:
      - rabbitmq
    networks:
      - rabbit-net
    environment:
      - RABBITMQ_HOST=rabbitmq

networks:
  rabbit-net:
    driver: bridge

volumes:
  rabbit-data: